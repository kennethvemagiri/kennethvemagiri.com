<!DOCTYPE html>
<html lang="en" class="hire-page-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kenneth | AI Engineer</title>
  <meta name="description" content="Search the portfolio by role or keywords and see matching work on the Hire Me page.">
  <link rel="canonical" href="https://kennethvemagiri.com/hire.html">

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon-96x96.png" type="image/png" sizes="96x96">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="hire-one-page">
  <a href="#hire-main" class="skip-link">Skip to main content</a>

  <header class="site-header"></header>

  <main id="hire-main" class="hire-main" aria-label="Hire me">
    <div class="hire-inner">
      <p class="hire-availability">
        <span class="hire-availability-dot" aria-hidden="true"></span>
        Available to work
      </p>
      <form id="hire-search-form" class="hire-search-form-min" role="search" aria-label="Find portfolio matches for your job description">
        <div class="hire-search-bar-min">
          <span class="hire-search-icon-min" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.75"/>
              <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
            </svg>
          </span>
          <input type="search"
            id="hire-search-query"
            class="hire-search-input-min"
            name="q"
            maxlength="600"
            autocomplete="off"
            enterkeyhint="search"
            placeholder="Search by role, skills, or keywords from the job post"
            aria-label="Search portfolio for matching work">
          <button type="submit" class="hire-search-submit-min">View matching work</button>
        </div>
      </form>
    </div>

    <section class="hire-results" id="hire-results" aria-label="Live matches" hidden>
      <p id="hire-results-banner" class="hire-match-banner" role="status" aria-live="polite" hidden></p>
      <div class="projects-grid hire-results-grid" id="hire-results-grid"></div>
      <p class="hire-results-foot">
        Results stay on this page. Prefer the homepage grid?
        <a class="hire-results-foot-link" href="/#work">Browse Work →</a>
      </p>
    </section>
  </main>

  <div class="hire-page-scripts">
    <script src="js/site-header.js" defer></script>
    <script src="js/render-site-content.js" defer></script>
    <script src="script.js" defer></script>
  </div>
</body>
</html>
