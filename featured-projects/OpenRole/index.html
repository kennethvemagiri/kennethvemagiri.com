<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenRole | Kenneth Vemagiri</title>
  <meta name="description" content="OpenRole — role-based access, permissions, and identity tooling." />
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 48px 20px; }
    .top a { color: #b45309; text-decoration: none; font-weight: 600; }
    .card {
      margin-top: 18px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 6px 18px rgba(2, 6, 23, 0.06);
    }
    .header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .logo {
      width: 104px; height: 104px;
      border-radius: 18px;
      border: 1px solid #e2e8f0;
      background: #fff;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .logo img { width: 100%; height: 100%; object-fit: contain; }
    h1 { font-size: 32px; line-height: 1.15; margin: 0; letter-spacing: -0.02em; }
    .meta { color: #475569; margin-top: 8px; }
    .pill {
      display: inline-block;
      margin-top: 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 6px 10px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 18px; }
    .row { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; }
    .row strong { display: block; margin-bottom: 4px; }
    .row span { color: #475569; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <a href="../../index.html#projects">← Back to portfolio</a>
    </div>

    <section class="card" aria-label="OpenRole project">
      <div class="header">
        <div class="logo" aria-hidden="true">
          <img src="./logo.png" alt="" loading="eager" decoding="async" />
        </div>
        <div>
          <h1>OpenRole</h1>
          <div class="meta">Role-based access, permissions, and identity tooling for modern apps.</div>
          <span class="pill">New</span>
        </div>
      </div>

      <div class="grid">
        <div class="row">
          <strong>Status</strong>
          <span>Page placeholder added so the project tile works.</span>
        </div>
        <div class="row">
          <strong>Logo</strong>
          <span>Loaded from <code>featured-projects/OpenRole/logo.png</code>.</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
